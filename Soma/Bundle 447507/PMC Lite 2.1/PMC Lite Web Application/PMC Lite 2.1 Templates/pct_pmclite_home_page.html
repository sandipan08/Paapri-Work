    <script>
        // date function
        var now = new Date();
        var day = now.getDate();

        var fullDate = month + "/" + day + "/" + year;
        $("#date").html(fullDate);

        //functon to give alert only for last quantiity of last operation
        function buildConfirm() {

            if (($("#lastOperation").val() == 1) && ($("#input-quantity").val() >= ('${ds.quantity}' - '${ds.completedQuantity}'))) {
                swal({
                    type: "warning",
                    title: "Do You Want To Build",
                    showCancelButton: true
                }).then(function () {
                    $('#lastOperation').val();
                    complete(1)

                }, function (dismiss) {
                    // alert(dismiss)
                    if (dismiss == 'cancel') {
                        $('#lastOperation').val();
                        complete(0)
                    }
                });
            }
            else {
                complete(0);
            }


        }

        function complete(build) {
            var LOGOUT_PAGE_URL = '${ds.logoutPageUrl}';
            var BREAK_PAGE_URL = '${ds.breakPageUrl}';
            var HOME_PAGE_URL = '${ds.homePageUrl}';
            var WO_COMPLETION_URL = '${ds.woCompletionUrl}';

            var QRAFTER_END_URL = '&qrcode={CODE}&browser=external'
            var ZXING_START_UTL = "http://zxing.appspot.com/scan?ret=";
            var isOverRunQty = '${ds.isOverRunQty}';


            if ($("#input-quantity").val().length === 0) {
                swal({
                    title: "Please enter quantity",
                    icon: "error",
                    button: "Ok",
                }).then((result) => {
                    $("#input-quantity").focus();
                });
                $("#input-quantity").val("");
                return false;
            }


            if (!IsValidQuantity()) {
                swal({
                    title: "Quantity must be a positive number!",
                    icon: "error",
                    button: "Ok",
                }).then((result) => {
                    $("#input-quantity").focus();
                });
                $("#input-quantity").val("");
                return false;
            }

            if (!IsFollowRemainingQuantity() && isOverRunQty == 0) {
                swal({
                    title: "Input quantity is greater than remaining quantity!",
                    icon: "error",
                    button: "Ok",
                }).then((result) => {
                    $("#input-quantity").focus();
                });
                $("#input-quantity").val("");
                return false;

            }
            $("#btn-complete").attr("disabled", "disabled");
            var userId = $("#user-id").val();
            var userName = $("#user-name").val();
            var loginRecordId = $("#login-record-id").val();
            var quantityToComplete = $("#input-quantity").val();
            var ticketNumber = $("#input-ticket-number").val();
            var startRecordId = $("#start-record-id").val();
            var operationName = $("#input-item").val();
            var scrapQuantity = $("#input-scrap-quantity").val();
            var quantityRework = $("#input-quantity-rework").val();
            var operationId = $("#op-internal-id").val();
            var sequenceId = $("#sequenceId").val();
            var workCenter = $("#workCenter").val();
            var workCenterName = $("#workCenterName").val();


            $(location).attr('href', WO_COMPLETION_URL +
                '&custparam_userId=' + userId +
                '&custparam_userName=' + userName +
                '&custparam_loginRecordId=' + loginRecordId +
                '&custparam_quantityToComplete=' + quantityToComplete +
                '&custparam_startRecordId=' + startRecordId +
                '&custparam_ticketNumber=' + ticketNumber +
                '&custparam_operationName=' + operationName +
                '&custparam_build=' + build +
                '&custparam_scrap_quantity=' + scrapQuantity +
                '&custparam_quantity_rework=' + quantityRework +
                '&custparam_opInternalId=' + operationId +
                '&custparam_sequence=' + sequenceId +
                '&custparam_workCenter=' + workCenter +
                '&custparam_workCenterName=' + workCenterName);


        }
        function getTime() {
            var today = new Date();
            var h = today.getHours();
            var m = today.getMinutes();
            var s = today.getSeconds();
            // add a zero in front of numbers<10  
            m = checkTime(m);
            s = checkTime(s);
            $('#time').html(h + ":" + m + ":" + s);
            setTimeout(function () { getTime() }, 1000);
        }
        //setInterval("getTime()",1000);//another way  
        function checkTime(i) {
            if (i < 10) {
                i = "0" + i;
            }
            return i;
        }

        function IsValidQuantity() {
            var inputQuantity = $("#input-quantity").val();
            var remainingQuantity = $("#remaining-quantity").val();
            if (inputQuantity >= 0) {
                return true;
            } else {
                return false;
            }
        }


        function IsFollowRemainingQuantity() {
            var inputQuantity = parseInt($("#input-quantity").val());
            var remainingQuantity = parseInt($("#remaining-quantity").val());
            if (inputQuantity <= remainingQuantity) {
                return true
            } else {
                return false
            }
        }

        /**
        * This method is used to get the device details
        */
        function GetDevice() {
            var userAgent = window.navigator.userAgent,
                platform = window.navigator.platform,
                macosPlatforms = ['Macintosh', 'MacIntel', 'MacPPC', 'Mac68K'],
                windowsPlatforms = ['Win32', 'Win64', 'Windows', 'WinCE'],
                iosPlatforms = ['iPhone', 'iPad', 'iPod'],
                device = null;

            if (macosPlatforms.indexOf(platform) !== -1) {
                device = 'Mac OS';
            } else if (iosPlatforms.indexOf(platform) !== -1) {
                device = 'iOS';
            } else if (windowsPlatforms.indexOf(platform) !== -1) {
                device = 'Windows';
            } else if (/Android/.test(userAgent)) {
                device = 'Android';
            } else if (!device && /Linux/.test(platform)) {
                device = 'Linux';
            }

            return device;
        }

        function sweetAlert(type, title, timer, input, confirmButtonText, text) {
            if (timer === undefined)
                timer = null;
            if (input === undefined)
                input = null;
            if (confirmButtonText === undefined)
                confirmButtonText = 'OK';
            swal({
                type: type,
                title: title,
                timer: timer,
                input: input,
                confirmButtonText: confirmButtonText,
                text: text,
            }, function () {
                swal.resetDefaults();
            }).catch(function () {
                swal.noop;
                swal.resetDefaults();
            });
        }
