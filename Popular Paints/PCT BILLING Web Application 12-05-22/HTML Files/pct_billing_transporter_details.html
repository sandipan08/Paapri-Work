<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="${ds.faviconUrl}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdn.datatables.net/1.11.5/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css"
        integrity="sha512-KfkfwYDsLkIlwQp6LFnl8zNdLGxu9YAA1QvwINks4PhcElQSvqcyVLLD9aMhXd13uQjoXtEKNosOWaZqXgel0g=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Transporter/Party Receipt</title>
</head>
<style>

</style>

<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand"
                href="https://7255402.extforms.netsuite.com/app/site/hosting/scriptlet.nl?script=466&deploy=1&compid=7255402&h=741700278bc9a50d40eb&custparam_userName=${ds.userName}"><img
                    src="${ds.faviconUrl}" class="logo-navbar" height=" 50px" width="50px"></a>
            <!-- <img class="navbar-brand" src="${ds.faviconUrl}" height=" 50px" width="50px"> -->
            <div class="collapse navbar-collapse d-flex flex-row-reverse" id="navbarNavAltMarkup">
                <div class="navbar-nav">
                    <span class="nav-link active" aria-current="page"><span> Welcome, ${ds.userName}</span></span>
                    <span class="nav-link"><i class="fas fa-sign-out-alt"></i></span>
                </div>
            </div>
        </div>
    </nav>
    <div class="card-body">
        <!-- --------------------------------- For Item Fulfillment Dropdown Tab ------------------------------------------>
        <div style=" border-radius: 5px;
        background-color: #f2f2f2;
        padding: 10px;">
            <div class="row mt-2">
                <div class="col-sm-2">
                    <div class="form-group">
                        <label style="padding: 3px;">Item Fulfillment Number</label>
                        <input list="fulfillmentList" id="itemFulfillmentNumber" name="itemFulfillmentNumber"
                            class="form-control" />
                        <datalist id="fulfillmentList">
                        </datalist>
                    </div>
                </div>
            </div>
        </div>
        <!-- --------------------------------- For Transporter Details Table ------------------------------------------>
        <div style=" border-radius: 5px;
        background-color: #f2f2f2; margin-top: 10px; padding: 10px">
            <div class="card-header text-center text-dark alert alert-primary" style="font-size: 20px;">
                Transporter/Party Receipt</div>
            <table id="transporterList" class="table table-striped table-hover" width="100%">
                <thead id="transporterListThead">
                </thead>
                <tbody id="transporterListTbody">
                </tbody>
            </table>
        </div>
        <div class="row mt-2">
            <div class="col-sm-4">
                <input type="button" class="btn btn-warning" value="Add Transporter/Party Receipt"
                    id="addTransporterPartyReceipt" hidden>
            </div>
        </div>
        <!-- --------------------------------- For Transporter Details Form ------------------------------------------>
        <form action="" class="fieldclass" method="post" id="transporterForm"
            style=" border-radius: 5px; background-color: #f2f2f2; padding: 10px; margin-top: 10px;" hidden>
            <div class="card-header text-center text-dark alert alert-primary" style="font-size: 20px;">
                Transporter/Party Receipt Form
            </div>
            <hr>

            <div class="row mt-2">
                <div class="col-sm-3">
                    <div class="form-group">
                        <div class="form-group">
                            <label style="padding: 3px;">Deport</label>
                            <input type="text" id="deport" class="form-control" name="deport" disabled>
                        </div>
                        </datalist>
                    </div>
                </div>
                <div class="col-sm-3">
                    <div class="form-group">
                        <div class="form-group">
                            <label style="padding: 3px;">Customer Name</label>
                            <input type="text" id="customerName" class="form-control" name="customerName" disabled>
                        </div>
                    </div>
                </div>
                <div class="col-sm-2">
                    <div class="form-group">
                        <label style="padding: 3px;">Driver Name</label>
                        <input list="driverList" id="driverName" name="driverName" class="form-control" />
                        <datalist id="driverList">
                        </datalist>
                    </div>
                </div>
                <div class="col-sm-3">
                    <div class="form-group">
                        <label style="padding: 3px;">Transport Name</label>
                        <input list="transportList" id="transportName" name="transportName" class="form-control" />
                        <datalist id="transportList">
                        </datalist>

                    </div>
                </div>
            </div>
            <div class="row mt-2">
                <div class="col-sm-2">
                    <div class="form-group">
                        <label style="padding: 3px;">Vehicle Number</label>
                        <input type="text" id="vehicleNumber" class="form-control" name="vehicleNumber" disabled>
                    </div>
                </div>
                <div class="col-sm-2">
                    <div class="form-group">
                        <label style="padding: 3px;">Date</label>
                        <input type="date" id="transporterDate" class="form-control" name="transporterDate">
                    </div>
                </div>
                <div class="col-sm-2">
                    <div class="form-group">
                        <label style="padding: 3px;">Trip</label>
                        <input list="tripList" id="trip" name="trip" class="form-control" />
                        <datalist id="tripList">
                            <option value="Trip 1" data-value=1></option>;
                            <option value="Trip 2" data-value=2></option>;
                            <option value="Trip 3" data-value=3></option>;
                            <option value="Trip 4" data-value=4></option>;
                            <option value="Trip 5" data-value=5></option>;
                            <option value="Trip 6" data-value=6></option>;
                            <option value="Trip 7" data-value=7></option>;
                            <option value="Trip 8" data-value=8></option>;
                            <option value="Trip 9" data-value=9></option>;
                            <option value="Trip 10" data-value=10></option>;
                        </datalist>
                    </div>
                </div>
            </div>
            <div class="row mt-2">
                <div class="col-sm-3">
                    <div class="form-group">
                        <label style="padding: 3px;">Invoice Number</label>
                        <!-- <input list="invoiceList" id="invoiceNumber" name="invoiceNumber" class="form-control" />
                        <datalist id="invoiceList">
                        </datalist> -->
                        <select id="invoiceNumber" class="form-control" name="invoiceNumber" multiple>
                        </select>
                    </div>
                </div>
                <div class="col-sm-4">
                    <div class="form-group">
                        <label style="padding: 3px;">Ship Address</label>
                        <textarea id="shipAddress" name="shipAddress" rows="5" class="form-control"></textarea>
                    </div>
                </div>
                <div class="col-sm-4">
                    <div class="form-group">
                        <label style="padding: 3px;">Remarks</label>
                        <textarea id="remarks" name="remarks" rows="5" class="form-control"></textarea>
                    </div>
                </div>
                <div class="col-sm-4">
                    <div class="form-group">
                        <textarea id="dataStore" name="dataStore" rows="5" class="form-control" hidden></textarea>
                    </div>
                </div>
            </div>
            <div style="margin-top: 10px;">
                <nav>
                    <div class="nav nav-tabs" id="nav-tab" role="tablist">
                        <button class="nav-link active" id="nav-home-tab" data-bs-toggle="tab"
                            data-bs-target="#nav-home" type="button" role="tab" aria-controls="nav-home"
                            aria-selected="true">Packaging
                            Details</button>
                    </div>
                </nav>
                <div class="tab-content" id="nav-tabContent">
                    <div class="tab-pane fade show active" id="nav-home" role="tabpanel" aria-labelledby="nav-home-tab">
                        <table class="table table-striped" id="transporterLine">
                            <thead>
                                <tr>
                                    <th scope="col">Description</th>
                                    <th scope="col">Packaging</th>
                                    <th scope="col">Remarks</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>
                                        <input list="descriptionList" class="form-control description" />
                                        <datalist id="descriptionList">
                                            <option value="Bundle" data-value=1></option>;
                                            <option value="Carton Box" data-value=2></option>;
                                            <option value="Bag" data-value=3></option>;
                                            <option value="Buckets" data-value=4></option>;
                                            <option value="Loose (BKT/TIN)" data-value=5></option>;
                                            <option value="Drum" data-value=6></option>;
                                        </datalist>
                                    </td>
                                    <td><input type="text" class="form-control packaging" name="packaging">
                                    </td>
                                    <td>
                                        <textarea rows="3" class="form-control remarksLine"></textarea>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                        <!-- Add Packaging Details Button -->
                        <div class="row mt-2">
                            <div class="col-sm-4">
                                <input type="button" class="btn btn-danger" value="Add Packaging Details"
                                    id="addPackagingDetails">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Submit Button -->
            <div class="row mt-2">
                <div class="col-sm-4">
                    <input type="submit" class="btn btn-success" value="Submit" id="submitButton">
                </div>
            </div>
        </form>
    </div>


    <script src="https://code.jquery.com/jquery-3.5.1.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
        crossorigin="anonymous"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/dataTables.bootstrap5.min.js"></script>
    <script
        src="https://4946548-sb1.app.netsuite.com/core/media/media.nl?id=5955673&c=4946548_SB1&h=RTAtaa184Go6DIRd4dfbJfXuzbY4e5vab8GEoBcyY_L0tBFh&_xt=.js"></script>
    <script src="https://malsup.github.io/jquery.blockUI.js">
    </script>
    <!------------------------------------------------ Controller  ---------------------------------->
    <script>
        $(document).ready(function ()
        {
            console.log("In Controller");
            // ---- Generate Item Fulfillment DropDown ----------------- 
            var fulfillmentDropdown = `${ds.fulfillmentDropdown}`;
            $("#fulfillmentList").html(fulfillmentDropdown);
            var sendFulfillmentNumber = `${ds.sendFulfillmentNumber}`;
            if (sendFulfillmentNumber)
            {
                $("#itemFulfillmentNumber").val(`${ds.sendFulfillmentNumber}`);
                $('#addTransporterPartyReceipt').attr('hidden', false);
                // Populate Transporter Receipt Form on Button(Add Transporter/Party Receipt) Click
                $('#addTransporterPartyReceipt').click(function ()
                {
                    $('#transporterForm').attr('hidden', false);
                })
            }
            // ---- Generate Transporter Details Table ----------------- 
            $("#transporterListThead").html(`${ds.transporterThead}`);
            $("#transporterListTbody").html(`${ds.transporterTbody}`);
            // ---- Generate Deport DropDown ----------------- 
            $("#deport").val(`${ds.location}`);
            // ---- Generate Customer DropDown ----------------- 
            $("#customerName").val(`${ds.customerName}`);
            // ---- Generate Driver DropDown ----------------- 
            $("#driverList").html(`${ds.driverDropdown}`);
            // ---- Generate Transport DropDown ----------------- 
            $("#transportList").html(`${ds.transportDropdown}`);
            // ---- Generate Invoice DropDown ----------------- 
            $("#invoiceNumber").html(`${ds.invoiceDropdown}`);
            // ---- Generate Shipping Address ----------------- 
            $("#shipAddress").html(`${ds.shipAddress}`);
            // --------------------------- In Change of Fulfillment Dropdown ------------------------------
            $('#itemFulfillmentNumber').change(function ()
            {
                var fulfillmentNumber = $('#itemFulfillmentNumber').val();
                var fulfillmentId = $('#fulfillmentList [value="' + fulfillmentNumber + '"]').data('value');
                console.log("Changed Fulfillment Number : " + fulfillmentNumber);
                console.log("Changed Fulfillment Id : " + fulfillmentId);
                window.open('https://7255402.extforms.netsuite.com/app/site/hosting/scriptlet.nl?script=594&deploy=1&compid=7255402&h=93639630c5db0170da52&userName=Sandipan&fulfillId=' + fulfillmentId, "_self")

            });
            // --------------------------- Add Packaging Details Button Function ------------------------------
            $('#addPackagingDetails').click(function ()
            {
                var flag = false;
                $('#transporterLine tbody tr').each(function (index, tr)
                {
                    var description = $(this).find(".description").val();
                    var packaging = $(this).find(".packaging").val();
                    var remarksLine = $(this).find(".remarksLine").val();
                    console.log("Description : " + description + ", Packaging : " + packaging + ", Remarks : " + remarksLine)
                    // Checking if Value Present in TBody or Not
                    if (description || packaging || remarksLine)
                    {
                        flag = true;
                    }
                    else
                    {
                        flag = false;
                    }
                })
                if (flag)
                {
                    var myvar = '<tr>' +
                        '                                        <td>' +
                        '                                            <input list="descriptionList" id="description" name="description"' +
                        '                                                class="form-control description" />' +
                        '                                            <datalist id="descriptionList">' +
                        '                                                <option value="Bundle" data-value=1></option>;' +
                        '                                                <option value="Carton Box" data-value=2></option>;' +
                        '                                                <option value="Bag" data-value=3></option>;' +
                        '                                                <option value="Buckets" data-value=4></option>;' +
                        '                                                <option value="Loose (BKT/TIN)" data-value=5></option>;' +
                        '                                                <option value="Drum" data-value=6></option>;' +
                        '                                            </datalist>' +
                        '                                        </td>' +
                        '                                        <td><input type="text" class="form-control packaging" >' +
                        '                                        </td>' +
                        '                                        <td>' +
                        '                                            <textarea ="3" class="form-control remarksLine"></textarea>' +
                        '                                        </td>' +
                        '</tr>';
                    $("#transporterLine tbody").append(myvar);
                }
                else { alert("Please Fill The Value in Line Level"); }
            });
            // ---------------------------- Populate Vehicle Number on Driver Change -------------------
            $('#driverName').change(function ()
            {
                var vehicleDropdownObj = JSON.parse(`${ds.vehicleDropdown}`);
                var driverName = $('#driverName').val();
                var driverId = $('#driverList [value="' + driverName + '"]').data('value');
                console.log("Vehicle Dropdown Obj : " + vehicleDropdownObj);
                console.log("Driver Details : " + driverName + ", Driver Id : " + driverId);
                $("#vehicleNumber").val(vehicleDropdownObj[driverId]);
            });
            // --------------------------- Submit Button Function ------------------------------
            $('#submitButton').click(function ()
            {
                $.blockUI();
                var dataObj = {};
                var dataArray = [];
                var dataChildArray = [];

                var deport = $("#deport").val();
                var customerName = $("#customerName").val();
                var driverName = $("#driverName").val();
                var transportName = $("#transportName").val();
                var vehicleNumber = $("#vehicleNumber").val();
                var transporterDate = $("#transporterDate").val();
                var invoiceNumber = $("#invoiceNumber").val();
                var trip = $("#trip").val();
                var remarks = $("#remarks").val();
                var shipAddress = $("#shipAddress").val();
                var fulfillmentNumber = $('#itemFulfillmentNumber').val();
                var fulfillmentId = $('#fulfillmentList [value="' + fulfillmentNumber + '"]').data('value');

                // Push Value in JSON Obj 
                dataObj['fulfillmentNumber'] = fulfillmentId;
                dataObj['deport'] = deport;
                dataObj['customerName'] = customerName;
                dataObj['driverName'] = driverName;
                dataObj['transportName'] = transportName;
                dataObj['vehicleNumber'] = vehicleNumber;
                dataObj['transporterDate'] = transporterDate;
                dataObj['invoiceNumber'] = invoiceNumber;
                dataObj['trip'] = trip;
                dataObj['shipAddress'] = shipAddress;
                dataObj['remarks'] = remarks;
                // console.log("PCT-Billing", "Deport : " + deport + ", Customer Name : " + customerName + ", Driver Name : " + driverName + ", Transporter Name : " + transportName + ', Vehicle No : ' + transporterDate +
                //     "Transporter Date : " + transporterDate + ", Invoice No : " + invoiceNumber + ", Trip : " + trip + ", Remarks : " + remarks + ", Ship Address : " + shipAddress)


                $('#transporterLine tbody tr').each(function (index, tr)
                {
                    var description = $(this).find(".description").val();
                    var descriptionId = $('#descriptionList [value="' + description + '"]').data('value');
                    var packaging = $(this).find(".packaging").val();
                    var remarksLine = $(this).find(".remarksLine").val();
                    // console.log("Description : " + descriptionId + ", Packaging : " + packaging + ", Remarks Line : " + remarksLine);
                    if (description != undefined || remarksLine.length || packaging.length)
                    {
                        var dataChild = {};
                        dataChild['description'] = descriptionId;
                        dataChild['packaging'] = packaging;
                        dataChild['remarksLine'] = remarksLine;
                        dataChildArray.push(dataChild);
                    }
                });
                dataObj['lineData'] = dataChildArray;
                console.log("Data Obj : " + JSON.stringify(dataObj))
                $("#dataStore").val(JSON.stringify(dataObj));

            });
            // --------------------------- Populate Data Table ------------------------------
            $('#transporterList').DataTable({
                pagination: true,
                search: true,
                pageLength: 25,
            });


        });


    </script>
</body>

</html>
