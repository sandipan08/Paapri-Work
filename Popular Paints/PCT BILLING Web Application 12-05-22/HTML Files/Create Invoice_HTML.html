    <div class="container">
        <form class="form-inline" id="url" action="" enctype="multipart/form-data" method="post">
            <div class="row" style="padding: 0px; margin: 0px;">
                <div class="col-xs-12">
                    <div class="form-group">
                        <label class="sr-only" for="cust_id">So Number:</label>
                        <input list="Customer" class="form-control" id="cust_id" placeholder="Sales Orders:"
                            value="${ds.soDocNo}" name="cust_id" required disabled>
                    </div>
                    <div class="form-group">
                        <label for="printed">Printed</label><br>
                        <input type="checkbox" id="printed" name="printed" disabled>
                    </div>

                </div>
            </div>
    </div>

<script>

<div class="text-center" style="margin-top:5px;margin-bottom:5px">
    <button type="button" class="btn btn-primary" id="generate">Generate Invoice</button>
    <button type="button" class="btn btn-success" id="generateItemFulfillment">Generate Fulfillment</button>
    <button type="button" class="btn btn-danger" id="go_back">Go Back</button>
</div>

<script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
</body>
<script>
    var soPrinted = "${ds.soPrinted}";
    console.log("PCT-Billing : " + soPrinted + ", So Number : " + "${ ds.soDocNo }");
    if (soPrinted == "true")
    {
        $("#printed").prop("checked", true);
    }
    else
    {
        $("#printed").prop("checked", false);
    }
    var itemIndex = "${ds.transactionIndex}";
    console.log(itemIndex);
    $(document).ready(function ()
    {

        $("#go_back").click(function ()
        {
            location.href = `https://7255402.extforms.netsuite.com/app/site/hosting/scriptlet.nl?script=466&custparam_userName=${ds.empName}&deploy=1&compid=7255402&h=741700278bc9a50d40eb`;
        });
        $("#generate").click(function ()
        {
            console.log("For Invoice.......");
            var itemDataObj = {};
            var total = 0;
            $('.itemDetails').each((key, value) =>
            {
                var itemName = $(value).find('.item-id').val();
                var qty = $(value).find('.invoiceQuantity').val();
                itemDataObj[itemName] = qty;
                total += parseInt(qty);
            })

            console.log(itemDataObj);
            console.log("Total:" + total);

            if (total > 0)
            {

                location.href = `https://7255402.extforms.netsuite.com/app/site/hosting/scriptlet.nl?script=203&custparam_userName=${ds.empName}&recordname=${ds.salesorderId}&deploy=1&compid=7255402&h=948b7c05170081bcb1d2&datalist=` + JSON.stringify(itemDataObj);
            }
            else
            {
                alert('Sales Order has been billed / Please enter a valid quantity');
            }

        })
        $("#generateItemFulfillment").click(function ()
        {
            console.log("For Fulfillment.......");
            var itemDataObj = {};
            var total = 0;
            $('.itemDetails').each((key, value) =>
            {
                var itemName = $(value).find('.item-id').val();
                var qty = parseInt($(value).find('.fulfillmentQuantity').val());
                console.log("Item Name : " + itemName + ", Qty : " + qty + " Type Of : " + typeof (qty))
                itemDataObj[itemName] = qty;
                total += parseInt(qty);
            })

            console.log(itemDataObj);
            console.log("Total:" + total);

            if (total > 0)
            {
                location.href = `https://7255402.extforms.netsuite.com/app/site/hosting/scriptlet.nl?script=589&custparam_userName=${ds.empName}&recordname=${ds.salesorderId}&deploy=1&compid=7255402&h=a9b1d59e4539b8ce88b5&datalist=` + JSON.stringify(itemDataObj);
            }
            else
            {
                alert('Sales Order has been Fulfilled / Please enter a valid Quantity');
            }

        })

    })
</script>
