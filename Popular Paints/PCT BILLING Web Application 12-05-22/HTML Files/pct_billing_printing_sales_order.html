<script>
    $(document).ready(function ()
    {
        $('#soTable').DataTable({
            pagination: true,
            search: true,
            pageLength: 25,
            ordering: false
        });
        $("#zone").change(() =>
        {
            var zone = $('#zone').val();
            $('#hiddenZoneId').val(zone)
        })
    });


</script>
