                </div>

                <div class="col-xs-12" style="margin-bottom:5px">
                    <div class="form-group">

                            #SODROPDOWN-CONTENTS#

                    </div>

                    <button type="submit" class="btn btn-success" id="checkSo" name="checkSo"

                    <button type="submit" class="btn btn-danger" id="printPT" name="printPT"

                        </select>
                    </div>
                    <button type="submit" class="btn btn-success" id="load_invoice" name="load_invoice"
                        value="loadInvoice">Load
                        Invoice</button>
                    <button type="submit" class="btn btn-primary" id="generate_invoice" name="generate_invoice"

                        Invoice</button>

        <div>

<script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
<script>
    document.getElementById("url").action = window.location.href;
    function startTime()
    {
        const today = new Date();
        let h = today.getHours();
        let m = today.getMinutes();
        let s = today.getSeconds();
        m = checkTime(m);
        s = checkTime(s);
        document.getElementById('time').innerHTML = h + ":" + m + ":" + s;
        var current_date = new Date();
        var dd = current_date.getDate();
        var mm = current_date.getMonth() + 1;
        var yyyy = current_date.getFullYear();

        document.getElementById('date').innerHTML = dd + "/" + mm + "/" + yyyy;

        setTimeout(startTime, 1000);
    }

    function checkTime(i)
    {
        if (i < 10) { i = "0" + i };  // add zero in front of numbers < 10
        return i;
    }
    disable();
    function disable()
    {

        var soCount = "${ds.soCount}";
        console.log("SO : " + soCount);
        var invCount = "${ds.invCount}";
        console.log("inv : " + invCount);
        if (invCount != 0)
        {
            $('#generate_invoice').prop('disabled', false);

        }

        if (soCount != 0)
        {

            $('#checkSo').prop('disabled', false);
            $('#printSo').prop('disabled', false);
            $('#printPT').prop('disabled', false);
            //$('#generate_invoice').prop('disabled', false);

        }
        else if (soCount == 0)
        {
            $('#checkSo').prop('disabled', true);
            $('#printSo').prop('disabled', true);
            $('#printPT').prop('disabled', true);
        }

    }

    function blankSoCheck(customerName)
    {
        console.log("Value: " + document.getElementById("customerName").value);
        if (document.getElementById("customerName").value != "")
        {
            $('#generateSo').prop('disabled', false);
        }
        else
        {
            $('#generateSo').prop('disabled', true);
        }


    }
    function blankInvCheck(inv_id)
    {
        console.log("Value: " + document.getElementById("inv_id").value);
        if (document.getElementById("inv_id").value != "")
        {
            $('#generate_invoice').prop('disabled', false);
        }
        else
        {
            $('#generate_invoice').prop('disabled', true);
        }

    }
    function custNameFound()
    {
        swal({

            title: "Selected Customer:",
            text: document.getElementById("customerName").value,
            icon: "success"
        }).then(() =>
        {
            swal({
                title: "Gathering Sales Orders..",
                icon: "info"
            });
        });

    }
    function buttonClick()
    {
        console.log("Button Click");
        // window.open(`https://7255402.extforms.netsuite.com/app/site/hosting/scriptlet.nl?script=590&custparam_userName=${"Sandipan"}deploy=1&compid=7255402&h=bc8e3598ab0df9ae9850`, "_self");
        window.open(`https://7255402.extforms.netsuite.com/app/site/hosting/scriptlet.nl?script=590&deploy=1&compid=7255402&h=bc8e3598ab0df9ae9850&userName=${ds.empName}`, "_self")
    }
    function buttonSubmit()

        // window.open(`https://7255402.extforms.netsuite.com/app/site/hosting/scriptlet.nl?script=590&custparam_userName=${"Sandipan"}deploy=1&compid=7255402&h=bc8e3598ab0df9ae9850`, "_self");

    }
</script>
