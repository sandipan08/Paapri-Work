<!DOCTYPE html>
<html lang="en">


<head>
    <title>PCT QMS | Alkyd Resin Testing Report Form </title>

    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="icon" type="image/png" href="${ds.faviconUrl}" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
        integrity="sha512-1ycn6IcaQQ40/MKBW2W4Rhis/DbILU74C1vSrLJxCq57o941Ym01SwNsOMqvEBFlcgUa6xLiPY/NS5R+E6ztJQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />



</head>
<style>
    img.logo-navbar {
        width: 2.5rem !important;
        height: 2.5rem !important;

    }

    body {
        background: -webkit-linear-gradient(left, #0072ff, #00c6ff);
    }
</style>


<body>
    <nav class="navbar navbar-light" style="background-color: #e3f2fd;">
        <div class="container-fluid">
            <div class="navbar-header">

                <ul class="nav navbar-nav navbar-right">
                    <a class="nav navbar-brand" href="#" style="padding-top: 0.700rem;"><img src="${ds.faviconUrl}"
                            class="logo-navbar" width="30px" height="30px"></a>
                    <li><a style="font-size: medium; color: black;">PCT QMS</a></li>
                </ul>
            </div>
            <div class="collapse navbar-collapse" id="myNavbar">
                <ul class="nav navbar-nav navbar-right">
                    <li><a><span class="glyphicon glyphicon-user"></span> ${ds.custparam_userName}</a></li>
                    <li><a href="${ds.logoutPageUrl}"><span class="glyphicon glyphicon-log-in" id="btn-change">
                                Logout</span> </a></li>
                    <!-- <button></button> -->
                </ul>
            </div>
        </div>
    </nav>

    <div style="width: 100%;">
        <div style="width: 100%; height: 100px; float: left;">
            <div
                style="  margin-left: 20px; margin-right: 20px; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); height: auto; background: white">
                <!-- <table class=" table table-success table-striped"> -->
                <form id="currentURL" enctype="multipart/form-data" method="post"
                    style="padding-top: 30px; padding-bottom: 30px; padding-left: 20px; padding-right: 20px;">

                    <h3>Alkyd Resin Testing Report Form</h3>
                    <p>Please fill in this form.</p>
                    <hr>
                    <div class="row mt-2">
                        <div class="col-sm-3">
                            <div class="form-group">
                                <label>Product Name</label>
                                <input type="text" id="productName" class="form-control" name="productName" disabled
                                    value="${ds.productName}">
                            </div>
                        </div>
                        <div class="col-sm-3">
                            <div class="form-group">
                                <label>Document Type</label>
                                <input type="text" id="documentType" class="form-control" name="documentType" disabled
                                    value="${ds.documentType}">
                            </div>
                        </div>
                        <div class="col-sm-3">
                            <div class="form-group">
                                <label>Document Number</label>
                                <input type="text" id="documentNumber" class="form-control" name="documentNumber"
                                    disabled value="${ds.documentNumber}">
                            </div>
                        </div>
                    </div>

                    <div class="row mt-2">
                        <div class="col-sm-2">
                            <div class="form-group">
                                <label>Batch No</label>
                                <input type="text" id="batchNo" class="form-control" name="batchNo"
                                    value="${ds.batchNo}" disabled>
                            </div>
                        </div>
                        <div class="col-sm-2">
                            <div class="form-group">
                                <label>Party Name</label>
                                <input type="text" id="partyName" class="form-control" name="partyName"
                                    value="${ds.partyName}" disabled>
                            </div>
                        </div>
                        <div class="col-sm-2">
                            <div class="form-group">
                                <label>Vehicle No</label>
                                <input type="text" id="vehicleNo" class="form-control" name="vehicleNo">
                            </div>
                        </div>
                        <div class="col-sm-2">
                            <div class="form-group">
                                <label>Sp Gravity</label>
                                <input type="text" id="spGravity" class="form-control" name="spGravity">
                            </div>
                        </div>
                        <div class="col-sm-2">
                            <div class="form-group">
                                <label>Viscosity at 30'c/25'c</label>
                                <input type="text" id="viscosity" class="form-control" name="viscosity">
                            </div>
                        </div>

                    </div>

                    <div class="row mt-2">
                        <div class="col-sm-2">
                            <div class="form-group">
                                <label>PH Value</label>
                                <input type="text" id="phValue" class="form-control" name="phValue">
                            </div>
                        </div>


                        <div class="col-sm-2">
                            <div class="form-group">
                                <label>Solid percentage</label>
                                <input type="text" id="solidPercentage" class="form-control" name="solidPercentage">
                            </div>
                        </div>
                        <div class="col-sm-2">
                            <div class="form-group">
                                <label>Colour on gardner scale</label>
                                <input type="text" id="colOnGardnerScale" class="form-control" name="colOnGardnerScale">
                            </div>
                        </div>
                        <div class="col-sm-2">
                            <div class="form-group">
                                <label>Acid Value</label>
                                <input type="text" id="acidValue" class="form-control" name="acidValue">
                            </div>
                        </div>

                        <div class="col-sm-2">
                            <div class="form-group">
                                <label>Clearity</label>
                                <input type="text" id="clearity" class="form-control" name="clearity">
                            </div>
                        </div>
                    </div>

                    <div class="row mt-2">


                        <div class="col-sm-2">
                            <div class="form-group">
                                <label>Gloss on meter</label>
                                <input type="text" id="glossOnMeter" class="form-control" name="glossOnMeter">
                            </div>
                        </div>
                        <div class="col-sm-2">
                            <div class="form-group">
                                <label>Tolerancy</label>
                                <input type="text" id="tolerancy" class="form-control" name="tolerancy">
                            </div>
                        </div>

                        <div class="col-sm-2">
                            <div class="form-group">
                                <label>Drying Time Surface</label>
                                <input type="text" id="dryingTimeSurface" class="form-control" name="dryingTimeSurface">
                            </div>
                        </div>
                        <div class="col-sm-2">
                            <div class="form-group">
                                <label>Drying Time Tack Free</label>
                                <input type="text" id="dryingTimeTackFree" class="form-control"
                                    name="dryingTimeTackFree">
                            </div>
                        </div>
                        <div class="col-sm-2">
                            <div class="form-group">
                                <label>Drying Time Hard</label>
                                <input type="text" id="dryingTimeHard" class="form-control" name="dryingTimeHard">
                            </div>
                        </div>
                    </div>

                    <div class="row mt-2">
                        <div class="col-sm-3">
                            <div class="form-group">

                                <input type="checkbox" id="qcChecked" name="qcChecked">
                                <label>Qc Approved</label><br>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-sm-4">
                            <div class="form-group">
                                <label>Report</label>
                                <!-- <input type="text" id="report" class="form-control" name="report"
                                    style="height: 100px;"> -->
                                <input id="report" name="subject" placeholder="Write something.." class="form-control"
                                    style="height:100px" name="report"></input>
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <button type="submit" id="Success" class="btn btn-success ml-3 mr-2"
                            onclick="return check()">Submit</button>
                        <button type="button" style="  background: #FF5370;" class="btn btn-success ml-3 mr-2"
                            onclick="history.back()">Back</button>
                    </div>

                </form>
                       <footer>

                    <p class="attribution" style="text-align: center; padding-bottom: 10px;">

                        Copyright @2021 All rights reserved | Designed & Developed by <a
                            href="https://www.paapri.com/">Paapri

                            Business Technologies

                        </a>

                    </p>

                </footer>
            </div>
        </div>
    </div>


</body>


<script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
<script>

    // document.getElementById("url").action = window.location.href;
    function check()
    {
        // swal({
        //     title: "Success",
        //     text: "Record Created",
        //     icon: "success",
        //     buttons: false
        // })
    }
    disable();
    function disable()
    {
        var status = "${ds.documentStatus}";
        console.log(status);
        if (status === "Existing")
        {
            // $('#batchNo').prop('disabled', true);
            // document.getElementById("batchNo").value = "${ds.batchNo}";
            $('#vehicleNo').prop('disabled', true);
            document.getElementById("vehicleNo").value = "${ds.vehicleNo}";
            $('#phValue').prop('disabled', true);
            document.getElementById("phValue").value = "${ds.phValue}";
            $('#spGravity').prop('disabled', true);
            document.getElementById("spGravity").value = "${ds.spGravity}";
            $('#viscosity').prop('disabled', true);
            document.getElementById("viscosity").value = "${ds.viscosity}";
            $('#acidValue').prop('disabled', true);
            document.getElementById("acidValue").value = "${ds.acidValue}";
            $('#solidPercentage').prop('disabled', true);
            document.getElementById("solidPercentage").value = "${ds.solidPercentage}";
            $('#colOnGardnerScale').prop('disabled', true);
            document.getElementById("colOnGardnerScale").value = "${ds.colOnGardnerScale}";
            $('#clearity').prop('disabled', true);
            document.getElementById("clearity").value = "${ds.clearity}";
            $('#glossOnMeter').prop('disabled', true);
            document.getElementById("glossOnMeter").value = "${ds.glossOnMeter}";
            $('#tolerancy').prop('disabled', true);
            document.getElementById("tolerancy").value = "${ds.tolerancy}";
            $('#dryingTimeSurface').prop('disabled', true);
            document.getElementById("dryingTimeSurface").value = "${ds.dryingTimeSurface}";
            $('#dryingTimeTackFree').prop('disabled', true);
            document.getElementById("dryingTimeTackFree").value = "${ds.dryingTimeTackFree}";
            $('#dryingTimeHard').prop('disabled', true);
            document.getElementById("dryingTimeHard").value = "${ds.dryingTimeHard}";
            $('#qcChecked').prop('disabled', true);
            document.getElementById("qcChecked").value = "${ds.qcChecked}";
            $('#report').prop('disabled', true);
            // document.getElementById("report").value = "${ds.report}";
            var qcCheck = "${ds.qcChecked}";
            console.log(qcCheck);
            if (qcCheck == "true")
            {
                console.log("QC Checked True");
                $("#qcChecked").prop("checked", true);
            }
            else if (qcCheck == "false")
            {
                console.log("QC Checked False");
                $("#qcChecked").prop("checked", false);
            }
            $(':input[type="submit"]').prop('disabled', true);
        }
        else
        {

            $('#vehicleNo').prop('disabled', false);
            $('#phValue').prop('disabled', false);
            $('#spGravity').prop('disabled', false);
            $('#viscosity').prop('disabled', false);
            $('#acidValue').prop('disabled', false);
            $('#solidPercentage').prop('disabled', false);
            $('#colOnGardnerScale').prop('disabled', false);
            $('#clearity').prop('disabled', false);
            $('#glossOnMeter').prop('disabled', false);
            $('#tolerancy').prop('disabled', false);
            $('#dryingTimeSurface').prop('disabled', false);
            $('#dryingTimeTackFree').prop('disabled', false);
            $('#dryingTimeHard').prop('disabled', false);
            $('#report').prop('disabled', false);
            $('#qcChecked').prop('disabled', false);

        }
    }





</script>

</html>
