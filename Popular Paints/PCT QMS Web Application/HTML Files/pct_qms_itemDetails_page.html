<style>

        background: -webkit-linear-gradient(left, #0072ff, #00c6ff);

    select {

        margin: 8px 0;
        display: inline-block;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
    }

    input[type=submit] {
        width: 70%;
        background-color: #4CAF50;
        color: white;
        padding: 14px 20px;
        margin: 8px 0;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }

    input[type=submit]:hover {

    }

    thead th {
        background-color: #4CAF50;
        color: white;
    }

    th {
        text-align: center;
    }



    .btnContact {
        width: 10%;
        border: none;
        border-radius: 1rem;
        padding: 0.5%;
        /* background: #50C878; */
        font-weight: 600;
        color: #fff;
        cursor: pointer;

    }

        position: fixed;
        left: 0;
        bottom: 0;

        <!-- <table class="table table-success table-striped"> -->
        <form id="currentURL" enctype="multipart/form-data" method="post"
            style="padding-top: 30px; padding-left: 20px;">
            <div class="row mt-2">
                <div class="col-sm-2">

                        <th scope="col">Batch No</th>

        f.formData.innerHTML = JSON.stringify(mainData)
