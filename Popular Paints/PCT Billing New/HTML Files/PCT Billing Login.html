<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCT Billing | Login</title>
    <link rel="icon" type="image/png" href="#FETCH-LOGO#" />
    <!-- Bootstrap CSS CDN Start -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <!-- Bootstrap CSS CDN End -->
    <!-- External Stylesheet Link Start -->
    <link rel="stylesheet" href="#FETCH-STYLESHEET#">
    <!-- External Stylesheet Link End -->
</head>

<body>

    <!-- Login Page Design Start -->
    <form class="" id="url" action="" enctype="multipart/form-data" method="post" autocomplete="off"
        style="text-align:center;">
        <div class="container w-25 mt-5" id="logInFormContainer">
            <div id="loginForm" class="card shadow">
                <div class="card-body">
                    <div class="card-title mb-4 d-flex flex-column justify-content-center align-items-center">
                        <h4>PCT Billing</h4>
                        <img src="#FETCH-PAAPRI-LOGO#" alt="Image" height="100px" width="250px">
                    </div>
                    <div class="mb-3">
                        <input type="email" id="emailId" name="emailId" class="form-control"
                            placeholder="Type your Email" required>
                    </div>
                    <div class="mb-3">
                        <input type="number" id="loginPassword" name="loginPassword" class="form-control"
                            placeholder="Type your Password" required>
                    </div>

                    <div class="card-title mb-3 d-flex flex-column justify-content-center align-items-center">
                        <button type="submit" id="logIn" class="btn btn-primary btn-sm">Login</button>
                        <button type="button" id="forgotPassword" class="btn btn-primary btn-sm">Forgot
                            Password</button>
                    </div>
                </div>
            </div>
        </div>
    </form>
    <!-- Login Page Design End -->


    <!-- Jquery JS CDN Start -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"
        integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>
    <!-- Jquery JS CDN End -->
    <!-- Bootstrap JS CDN Start -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
    <!-- Bootstrap JS CDN End -->
    <!-- BlockUi CDN Link Start -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.blockUI/2.70/jquery.blockUI.min.js"
        integrity="sha512-eYSzo+20ajZMRsjxB6L7eyqo5kuXuS2+wEbbOkpaur+sA2shQameiJiWEzCIDwJqaB0a4a6tCuEvCOBHUg3Skg=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.blockUI/2.70/jquery.blockUI.js"
        integrity="sha512-QSb5le+VXUEVEQbfljCv8vPnfSbVoBF/iE+c6MqDDqvmzqnr4KL04qdQMCm0fJvC3gCWMpoYhmvKBFqm1Z4c9A=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <!-- BlockUi CDN Link ENd -->
    <!-- Sweet alert CDN Start -->
    <script src="//cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Sweet alert CDN End -->
</body>
<script>

    $(document).ready(function () {
        $("#forgotPassword").click(function (e) {
            // e.preventDefault();
            swal.fire({
                title: "Are you sure?",
                text: "Do you really want to reset?",
                type: "warning",
                showCancelButton: true,
                confirmButtonColor: '#DD6B55',
                confirmButtonText: 'Go on!',
                cancelButtonText: "Ops no!",
            }).then((result) => {
                if (result.value) {
                    window.open("https://system.netsuite.com/pages/customerlogin.jsp?country=US");
                }
                // else if (result.dismiss === 'cancel') {
                //     swal("Cancelled", "Invoice not created!", "error");
                // }
            });

        });


    });
</script>

</html>
